<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aplicaciones · LABG Suite</title>
<meta name="description" content="Catálogo de aplicaciones científicas LABG: estadística, experimentación agrícola, genética, biogeografía, botánica y herramientas para la ciencia.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<script src="data/config.js"></script>
<script src="data/apps.js"></script>

<script src="assets/js/site.js"></script>
</head>
<body data-page="aplicaciones">
<main>
  <section class="section" style="padding-bottom:24px;background:var(--paper);border-bottom:1px solid var(--line)">
    <div class="wrap" style="display:grid;gap:12px">
      <span class="eyebrow">Catálogo</span>
      <h1>Aplicaciones</h1>
      <p class="lead">Cada aplicación guía el análisis de principio a fin, explica la teoría en el camino y entrega figuras e informes listos para publicar.</p>
    </div>
  </section>
  <section class="section" style="padding-top:28px">
    <div class="wrap">
      <div class="toolbar">
        <label class="search" for="q"><span class="muted" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
          <input id="q" type="search" placeholder="Buscar: ANOVA, dendrograma, GBIF, heredabilidad…" autocomplete="off"></label>
        <select class="field" id="estado" aria-label="Disponibilidad">
          <option value="todas">Todas</option>
          <option value="enlinea">En línea</option>
          <option value="proximamente">Próximamente</option>
        </select>
      </div>
      <div class="toolbar" style="justify-content:space-between">
        <div class="pills" id="pills" role="group" aria-label="Área"></div>
        <span class="count" id="count"></span>
      </div>
      <div class="grid-apps" id="grid"></div>
    </div>
  </section>
</main>
</body>
</html>
