<body data-page="aplicaciones">
<a class="skip" href="#main">Saltar al contenido</a>
<div id="hdr" style="min-height:64px"></div>
<main id="main">
  <section class="section" style="padding-bottom:24px;background:var(--paper);border-bottom:1px solid var(--line)">
    <div class="wrap" style="display:grid;gap:12px">
      <span class="eyebrow">Catálogo</span>
      <h1>Aplicaciones</h1>
      <p class="lead">Cada aplicación guía el análisis de principio a fin, explica la teoría en el camino y entrega figuras e informes listos para publicar.</p>
    </div>
  </section>
  <section class="section" style="padding-top:28px">
    <div class="wrap">
      <div class="toolbar">
        <label class="search" for="q"><span class="muted" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
          <span class="sr-only">Buscar en el catálogo</span>
          <input id="q" type="search" placeholder="Buscar: ANOVA, dendrograma, heredabilidad, nicho…" autocomplete="off"></label>
        <label class="select-wrap"><span class="select-label">Disponibilidad</span>
          <select class="field" id="estado">
            <option value="todas">Todas</option>
            <option value="enlinea">En línea</option>
            <option value="proximamente">Próximamente</option>
          </select></label>
        <label class="select-wrap"><span class="select-label">Ordenar</span>
          <select class="field" id="orden">
            <option value="recomendado">Recomendado</option>
            <option value="nombre">Nombre (A–Z)</option>
            <option value="area">Área</option>
            <option value="version">Versión más reciente</option>
          </select></label>
        <div class="view-seg" id="vista" role="group" aria-label="Vista del catálogo">
          <button type="button" class="icon-btn" data-view="tarjetas" aria-pressed="true" aria-label="Ver como tarjetas" title="Tarjetas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></button>
          <button type="button" class="icon-btn" data-view="lista" aria-pressed="false" aria-label="Ver como lista" title="Lista"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg></button>
        </div>
      </div>
      <div class="toolbar" style="justify-content:space-between">
        <div class="pills" id="pills" role="group" aria-label="Área"></div>
        <span class="count" id="count" aria-live="polite"></span>
      </div>
      <div class="grid-apps" id="grid"></div>
    </div>
  </section>
