# Cada noche revisa tus repositorios: si una app ya está en GitHub Pages, cambió de
# versión, obtuvo DOI o manual, actualiza data/apps.js y regenera el portal.
# También avisa (el workflow falla y GitHub te manda correo) si un enlace se rompe.
name: Sincronizar apps y revisar enlaces
on:
  schedule:
    - cron: "17 8 * * *"   # 08:17 UTC = 02:17 en Ciudad de México
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Leer CITATION.cff y estado de Pages de cada app
        run: node scripts/sync-apps.mjs
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: node scripts/build.mjs
      - name: Guardar cambios
        run: |
          git config user.name "labg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sincronizar catálogo con los repositorios [skip ci]" && git push
  links:
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Revisar enlaces (apps, manuales, DOI)
        run: node scripts/check-links.mjs
