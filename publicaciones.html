<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Publicaciones · LABG Suite</title>
<meta name="description" content="Artículos, capítulos y software de Luis Ángel Barrera-Guzmán: chayote (Sechium), maíz nativo, recursos genéticos, distribución de especies.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<script src="data/config.js"></script>
<script src="data/apps.js"></script>
<script src="data/publicaciones.js"></script>
<script src="assets/js/site.js"></script>
</head>
<body data-page="publicaciones">
<div id="hdr" style="min-height:64px"></div>
<main>
  <section class="section" style="padding-bottom:24px;background:var(--paper);border-bottom:1px solid var(--line)">
    <div class="wrap" style="display:grid;gap:12px">
      <span class="eyebrow">Producción científica</span>
      <h1>Publicaciones</h1>
      <p class="lead">Artículos, capítulos de libro y software con DOI. Los trabajos abarcan los recursos genéticos del chayote (<i>Sechium</i>), los maíces nativos, los pastos forrajeros y el modelado de la distribución de especies.</p>
    </div>
  </section>
  <section class="section" style="padding-top:28px">
    <div class="wrap">
      <div class="toolbar">
        <label class="search" for="pq"><span class="muted" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
          <input id="pq" type="search" placeholder="Buscar por título, autor o revista" autocomplete="off"></label>
        <select class="field" id="tema" aria-label="Tema"></select>
      </div>
      <div class="toolbar" style="justify-content:space-between">
        <div class="pills" id="tipos" role="group" aria-label="Tipo de publicación"></div>
        <span class="count" id="pcount"></span>
      </div>
      <div id="pubs"></div>
    </div>
  </section>
</main>
</body>
</html>
